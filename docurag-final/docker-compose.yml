services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports: ["6333:6333","6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck: {test:["CMD-SHELL","wget --quiet --tries=1 --spider http://127.0.0.1:6333/healthz || exit 1"],interval:10s,timeout:5s,retries:5,start_period:10s}
  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    restart: unless-stopped
    env_file: [.env]
    environment: {QDRANT_URL: http://qdrant:6333,DATA_DIR: /app/data,RAW_DATA_DIR: /app/data/raw,IMAGE_DATA_DIR: /app/data/images,INDEX_DATA_DIR: /app/data/index,DATABASE_URL: sqlite:////app/data/index/docurag.db,MODEL_CACHE_DIR: /models}
    ports: ["8000:8000"]
    volumes: [./data:/app/data,model_cache:/models]
    depends_on: {qdrant:{condition:service_healthy}}
    healthcheck: {test:["CMD-SHELL","python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""],interval:20s,timeout:5s,retries:5,start_period:30s}
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: {backend:{condition:service_healthy}}
volumes:
  qdrant_data: {name: docurag_qdrant_data}
  model_cache: {name: docurag_model_cache}
